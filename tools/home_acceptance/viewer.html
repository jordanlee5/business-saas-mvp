<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页素材 · 本机联动预览</title>
<style>body{margin:0;background:#e5ebe3;font:16px/1.6 'Microsoft YaHei',sans-serif;color:#153d39}aside{max-width:740px;padding:16px;margin:auto;text-align:center}button{border:0;border-radius:24px;background:#153d39;color:white;padding:12px 22px;cursor:pointer;font:inherit}a{color:#153d39}.phone{max-width:430px;margin:0 auto 32px;background:#f5f6f0;border:7px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 16px 40px #183f3520}header{background:#153d39;color:white;text-align:center;padding:20px}main{padding:18px}.notice{background:#fff1cd;font-size:12px;color:#665224;padding:8px;text-align:center}.brand{background:linear-gradient(120deg,#153d39,#315b4b);border-radius:15px;color:white;padding:26px 20px}.brand h2{font-size:24px;line-height:1.4;margin:12px 0}.brand p{font-size:13px;margin:0}.banner{display:none;position:relative}.banner img{width:100%;aspect-ratio:5/2;object-fit:cover;border-radius:15px;display:block}.controls{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.controls button{font-size:12px;padding:6px 12px}.search{border-radius:32px;background:white;color:#8a998e;padding:12px;margin:20px 0}.grid{background:white;border-radius:20px;padding:20px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 6px}.entry{text-align:center;font-size:12px}.entry img,.art{width:58px;height:58px;border-radius:18px;object-fit:cover;margin:auto;display:flex;align-items:center;justify-content:center;font-size:30px;background:#ecf1e4}.entry p{margin:8px 0 0}.goods{display:grid;grid-template-columns:1fr 1fr;gap:12px}.goods div{background:white;border-radius:15px;overflow:hidden;padding-bottom:14px}.mock{height:130px;background:#e5eddf;display:flex;align-items:center;justify-content:center;font-size:64px}.goods p{margin:10px 12px 0}.small{font-size:12px;color:#6c7d70}.nav{background:white;padding:14px;text-align:center;font-size:14px}#status{min-height:24px;font-size:14px}</style>
<aside><a href="/__acceptance">← 返回验收首页</a><p>后台保存后，点击刷新。此页用于核对素材联动，小程序原生排版与手势请在独立工程检查。</p><button id="refresh">刷新素材</button><p id="status" role="status"></p></aside>
<div class="phone"><header>积分商城</header><div class="notice">独立验收 · 虚拟素材 · 网页联动预览</div><main><div id="brand" class="brand"><p>POINTS MALL / 积分商城</p><h2>把每一份积分，<br>换成喜欢的生活。</h2><p>精选好物 · 积分兑换</p></div><div id="banner" class="banner"><img id="hero" alt=""><div class="controls"><button id="prev">上一张</button><span id="count"></span><button id="pause">暂停</button><button id="next">下一张</button></div><p id="target" class="small"></p></div><div class="search">⌕ 搜索好物（预览占位）</div><h3>探索好物</h3><div id="entries" class="grid"></div><h3>精选好物</h3><div class="goods"><div><div class="mock">☕</div><p>虚拟日用好物</p><p class="small">仅供展示</p></div><div><div class="mock">♧</div><p>虚拟季节好物</p><p class="small">仅供展示</p></div></div></main><div class="nav">逛好物　　分类　　购物车　　个人中心</div></div>
<script>
(()=>{const csrf='{{NONCE}}',names=['居家日用','滋味零食','食品生鲜','首饰箱包','数码家电','全球美妆','厨房用品','母婴儿童'],keys=['home','food','fresh','bags','digital','beauty','kitchen','kids'],icons=['⌂','◉','♧','▣','▤','♜','♨','♧'];let urls=[],banners=[],index=0,paused=false,epoch=0;
 const status=document.querySelector('#status');
 const show=()=>{document.querySelector('#brand').style.display=banners.length?'none':'block';document.querySelector('#banner').style.display=banners.length?'block':'none';if(!banners.length)return;index=(index+banners.length)%banners.length;const item=banners[index],img=document.querySelector('#hero');img.src=item.local;img.alt=item.title;document.querySelector('#count').textContent=`${index+1} / ${banners.length}`;document.querySelector('#target').textContent=item.title+' · '+(item.target_category?'点击目标：'+names[keys.indexOf(item.target_category)]:'仅展示');};
 document.querySelector('#prev').onclick=()=>{index--;show()};document.querySelector('#next').onclick=()=>{index++;show()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暂停'};setInterval(()=>{if(!paused&&banners.length>1){index++;show()}},5000);
 document.querySelector('#hero').onerror=()=>{banners.splice(index,1);index=0;show()};
 async function refresh(){const current=++epoch;status.textContent='正在读取本机素材…';
 try{const grant=await fetch('/__acceptance/member-session',{method:'POST',headers:{'X-Acceptance-CSRF':csrf}});if(!grant.ok)throw Error();const token=(await grant.json()).token;
 const request=async path=>{const r=await fetch(path,{cache:'no-store',headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error();return r;};
 const [entries,slides]=await Promise.all(['/api/miniprogram/v1/home-entries','/api/miniprogram/v1/home-banners'].map(async p=>(await request(p)).json()));
 const fresh=[];const image=async path=>{if(!path)return '';try{const r=await request(path);const url=URL.createObjectURL(await r.blob());fresh.push(url);return url;}catch(_){return '';}};
 const pictures=await Promise.all(entries.map(item=>image(item.image_url)));const nextBanners=(await Promise.all(slides.map(async row=>({...row,local:await image(row.image_url)})))).filter(row=>row.local);
 if(current!==epoch){fresh.forEach(URL.revokeObjectURL);return;}urls.forEach(URL.revokeObjectURL);urls=fresh;
 const grid=document.querySelector('#entries');grid.replaceChildren();entries.forEach((entry,i)=>{const cell=document.createElement('div');cell.className='entry';let art;if(pictures[i]){art=document.createElement('img');art.src=pictures[i];art.alt=entry.name;art.onerror=()=>{const fallback=document.createElement('div');fallback.className='art';fallback.textContent=icons[i];art.replaceWith(fallback);};}else{art=document.createElement('div');art.className='art';art.textContent=icons[i];}const name=document.createElement('p');name.textContent=entry.name;cell.append(art,name);grid.append(cell);});banners=nextBanners;index=0;show();status.textContent='已刷新 · '+new Date().toLocaleTimeString();
 }catch(_){status.textContent='读取失败，请确认本机验收服务已启动，再点刷新。';}}
 document.querySelector('#refresh').onclick=refresh;window.addEventListener('pagehide',()=>{epoch++;urls.forEach(URL.revokeObjectURL);urls=[];});refresh();})();
</script></html>
