<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>宣传页暂不可用</title>

    <style>
        body {
            margin: 0;
            display: grid;
            min-height: 100vh;
            place-items: center;
            font-family:
                "Microsoft YaHei",
                Arial,
                sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .not-found-card {
            width: min(440px, calc(100% - 32px));
            padding: 42px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow:
                0 18px 50px
                rgba(15, 23, 42, 0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        p {
            margin-bottom: 0;
            color: #64748b;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <div class="not-found-card">
        <h1>宣传页暂不可用</h1>
        <p>
            该页面不存在、尚未发布，
            或已由管理员取消发布。
        </p >
    </div>
</body>
</html>
