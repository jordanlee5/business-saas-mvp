<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首次登录修改密码</title>

    <style>
        body {
            margin: 0;
            font-family:
                "Microsoft YaHei",
                Arial,
                sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .password-container {
            max-width: 440px;
            margin: 70px auto;
            padding: 20px;
        }

        .password-card {
            padding: 36px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow:
                0 10px 30px
                rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #0f172a;
            font-size: 26px;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 24px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        .account {
            margin-bottom: 20px;
            padding: 11px 14px;
            border-radius: 10px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 14px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-bottom: 18px;
            padding: 12px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        .tip {
            margin-top: 16px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .logout-link {
            display: block;
            margin-top: 18px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
            text-decoration: none;
        }

        .logout-link:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="password-container">
    <div class="password-card">

        <h1>首次登录安全验证</h1>

        <div class="subtitle">
            为保护账号安全，
            请先修改管理员分配的初始密码。
            完成后即可进入系统。
        </div>

        <div class="account">
            当前账号：
            <strong>{{ username }}</strong>
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="post"
            action="/change-password"
        >
            <label for="current_password">
                当前初始密码
            </label>

            <input
                id="current_password"
                type="password"
                name="current_password"
                autocomplete="current-password"
                required
            >

            <label for="new_password">
                新密码
            </label>

            <input
                id="new_password"
                type="password"
                name="new_password"
                minlength="8"
                autocomplete="new-password"
                placeholder="至少 8 个字符"
                required
            >

            <label for="confirm_password">
                再次输入新密码
            </label>

            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                修改密码并进入系统
            </button>
        </form>

        <div class="tip">
            新密码不能与初始密码相同。
        </div>

        <a
            href=" "
            class="logout-link"
        >
            退出当前账号
        </a >

    </div>
</div>

</body>
</html>
